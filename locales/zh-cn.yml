name: 设计师
description: AI 驱动的设计师，可创建网页、应用和海报设计，包含配色方案、排版和实时预览。
capabilities: |
  ## 设计生成
  - 交互式项目规划，可选择风格、颜色和布局
  - 28 个精选设计方案，覆盖 20 种风格（企业、科技、趣味等）
  - 31 套配色方案，标准 YAML 格式，支持 CSS Token 生成
  - 11 款种子字体（7 英文 + 3 中文 + 1 图标），按需下载

  ## 页面类型
  - Web: blank, hero, grid, form, list, detail
  - App: blank, grid, form, list, detail（移动优先，触控区域 44px）
  - Poster: blank, hero, grid（vw 单位，支持打印）

  ## 设计系统
  - 标准 CSS 自定义属性，覆盖颜色、间距、排版、阴影
  - 配色 YAML 作为颜色的唯一数据源
  - design-spec.css 从配色 YAML 自动生成
  - 预览服务器支持实时刷新，端口 3000

  ## 使用场景
  - 设计企业蓝色主题的 SaaS 管理后台
  - 创建温馨的电商落地页及商品网格
  - 构建触控友好的移动应用界面
  - 设计编辑风格的会议海报
chat:
  title: 新建设计
  description: 告诉我你想设计什么，我会引导你完成规划、配色、字体和布局 — 支持实时预览。
  prompts:
    - 帮我设计一个 SaaS 管理后台
    - 创建一个温馨的电商落地页
    - 设计一个外卖配送移动应用
